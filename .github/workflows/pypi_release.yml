name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os.os }} on ${{ matrix.os.cibw_arch }}
    runs-on: ${{ matrix.os.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - os: ubuntu-latest
            cibw_arch: "x86_64"
          - os: ubuntu-24.04-arm
            cibw_arch: "aarch64"
          - os: windows-latest
            cibw_arch: "AMD64"
          - os: macos-latest
            cibw_arch: "arm64"
    env:
      CIBW_BEFORE_ALL: "rustup update stable && rustup default stable"
      CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable -y"
      CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
      CIBW_BUILD_VERBOSITY: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          fetch-depth: '0'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS: ${{ matrix.os.cibw_arch }}
        with:
          package-dir: ./python
          output-dir: ./python/wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os.os }}-${{ matrix.os.cibw_arch }}
          path: ./python/wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          fetch-depth: '0'

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist python

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: python/dist/*.tar.*

  release:
    needs: [build_wheels, build_sdist]
    # Dispatch on a branch for a dry-run build, on a vX.Y.Z tag to publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: python/dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: python/dist
